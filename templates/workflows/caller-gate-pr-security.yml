name: Gate PR security

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  # Unsupported until merge-group source binding has been implemented and proven.
  # Fail visibly instead of leaving queue changes outside the producer path.
  merge_group:
    types: [checks_requested]

jobs:
  security:
    permissions:
      contents: read
      pull-requests: read
      actions: read
      packages: read
      id-token: write
    uses: Tuinstra-DEV/devops/.github/workflows/reusable-gate-pr-security.yml@262ad0b2d5ab04c172b2a7336874d3635c322f7f
