---
- name: Render and validate production Umami templates on the controller
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - roles/production_host_baseline/defaults/main.yml
    - roles/production_umami/defaults/main.yml
  vars:
    production_caddy_enable_https: true
    production_umami_database_password: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    production_umami_app_secret: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    production_umami_two_factor_encryption_key: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
  tasks:
    - name: Create isolated Umami render directory
      ansible.builtin.tempfile:
        state: directory
        prefix: tuinstra-umami-render-
      register: rendered

    - name: Test rendered Umami templates
      block:
        - name: Redirect rendered Umami paths into the fixture
          ansible.builtin.set_fact:
            production_umami_root: "{{ rendered.path }}/www"
            production_umami_secret_root: "{{ rendered.path }}/etc"
            production_umami_data_root: "{{ rendered.path }}/data"

        - name: Create fixture directories
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: '0700'
          loop:
            - "{{ production_umami_root }}"
            - "{{ production_umami_secret_root }}"
            - "{{ production_umami_data_root }}"

        - name: Render the Umami environment fixtures
          ansible.builtin.template:
            src: "roles/production_umami/templates/{{ item }}.j2"
            dest: "{{ production_umami_secret_root }}/{{ item }}"
            mode: '0600'
          loop:
            - umami.env
            - postgres.env
          no_log: true

        - name: Render the Umami deployment fixtures
          ansible.builtin.template:
            src: "roles/production_umami/templates/{{ item.source }}"
            dest: "{{ rendered.path }}/{{ item.destination }}"
            mode: '0600'
          loop:
            - { source: compose.yml.j2, destination: compose.yml }
            - { source: admin-bootstrap.mjs.j2, destination: admin-bootstrap.mjs }
            - { source: onepassword-handoff.mjs.j2, destination: onepassword-handoff.mjs }
            - { source: umami.caddy.j2, destination: umami.caddy }

        - name: Validate Umami helper JavaScript syntax
          ansible.builtin.command:
            argv: [node, --check, "{{ rendered.path }}/{{ item }}"]
          loop:
            - admin-bootstrap.mjs
            - onepassword-handoff.mjs
          changed_when: false

        - name: Validate the rendered Umami Compose model
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --project-directory
              - "{{ rendered.path }}"
              - --file
              - "{{ rendered.path }}/compose.yml"
              - config
              - --quiet
          changed_when: false
      always:
        - name: Remove isolated Umami render fixtures
          ansible.builtin.file:
            path: "{{ rendered.path }}"
            state: absent
