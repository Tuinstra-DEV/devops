---
- name: Require exact Docker package versions
  ansible.builtin.assert:
    that:
      - production_docker_package_versions.keys() | sort == production_required_docker_packages | sort
      - item.value | length > 0
      - item.value != 'latest'
    fail_msg: Supply every required Docker package at an exact apt version.
  vars:
    production_required_docker_packages:
      - containerd.io
      - docker-buildx-plugin
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
  loop: "{{ production_docker_package_versions | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Pin Docker packages to the reviewed versions
  ansible.builtin.template:
    src: docker-apt-preferences.j2
    dest: /etc/apt/preferences.d/production-docker
    owner: root
    group: root
    mode: '0644'

- name: Install the pinned Docker packages
  ansible.builtin.apt:
    name: "{{ item.key }}={{ item.value }}"
    state: present
    update_cache: true
  loop: "{{ production_docker_package_versions | dict2items }}"
  loop_control:
    label: "{{ item.key }}={{ item.value }}"

- name: Create Docker daemon configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure bounded Docker logs and live restore
  ansible.builtin.template:
    src: docker-daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
  notify: Restart Docker

- name: Enable Docker services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - containerd.service
    - docker.service
  when: not ansible_check_mode
