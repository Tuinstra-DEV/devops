---
- name: Inspect Umami secret and bootstrap files
  ansible.builtin.stat:
    path: "{{ production_umami_secret_root }}/{{ item }}"
  loop:
    - database-password
    - app-secret
    - two-factor-encryption-key
    - admin-password
    - umami.env
    - postgres.env
    - admin-bootstrap.complete
  register: production_umami_protected_files
  no_log: true

- name: Verify Umami protected file permissions
  ansible.builtin.assert:
    that:
      - item.stat.isreg
      - item.stat.pw_name == 'root'
      - item.stat.gr_name == 'root'
      - item.stat.mode == '0600'
    quiet: true
  loop: "{{ production_umami_protected_files.results }}"
  no_log: true

- name: Inspect installed Umami retention files
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop:
    - { path: "{{ production_umami_retention_script }}", mode: '0700' }
    - { path: "{{ production_umami_retention_status_root }}", mode: '0700' }
    - { path: /etc/systemd/system/umami-retention.service, mode: '0644' }
    - { path: /etc/systemd/system/umami-retention.timer, mode: '0644' }
  register: production_umami_retention_files

- name: Verify installed Umami retention file ownership and modes
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.pw_name == 'root'
      - item.stat.gr_name == 'root'
      - item.stat.mode == item.item.mode
    quiet: true
  loop: "{{ production_umami_retention_files.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Verify the Umami retention systemd unit definitions
  ansible.builtin.command:
    argv:
      - /usr/bin/systemd-analyze
      - verify
      - /etc/systemd/system/umami-retention.service
      - /etc/systemd/system/umami-retention.timer
  changed_when: false

- name: Verify the Umami retention timer is enabled and active
  ansible.builtin.command:
    argv: [/usr/bin/systemctl, "{{ item }}", umami-retention.timer]
  loop:
    - is-enabled
    - is-active
  changed_when: false

- name: Validate the Umami retention schema and report dry-run aggregates
  ansible.builtin.command:
    argv:
      - "{{ production_umami_retention_script }}"
      - --check
  register: production_umami_retention_check
  changed_when: false
  failed_when: >-
    production_umami_retention_check.rc != 0 or
    production_umami_retention_check.stdout is not match('^umami-retention ') or
    production_umami_retention_check.stdout is not search('"mode": "check"')

- name: Read Umami Compose services
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - compose
      - --project-name
      - umami
      - --project-directory
      - "{{ production_umami_root }}"
      - --file
      - "{{ production_umami_root }}/compose.yml"
      - ps
      - --services
      - --status
      - running
  register: production_umami_running_services
  changed_when: false

- name: Require both Umami services to be running
  ansible.builtin.assert:
    that:
      - "'db' in production_umami_running_services.stdout_lines"
      - "'umami' in production_umami_running_services.stdout_lines"

- name: Resolve the running Umami container IDs
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - compose
      - --project-name
      - umami
      - --project-directory
      - "{{ production_umami_root }}"
      - --file
      - "{{ production_umami_root }}/compose.yml"
      - ps
      - --quiet
      - "{{ item }}"
  loop:
    - umami
    - db
  register: production_umami_container_ids
  changed_when: false
  failed_when: production_umami_container_ids.stdout | trim is not match('^[a-f0-9]{64}$')

- name: Read only the host port bindings from each Umami container
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - container
      - inspect
      - --format
      - "{{ '{{' }}json .HostConfig.PortBindings{{ '}}' }}"
      - "{{ item.stdout | trim }}"
  loop: "{{ production_umami_container_ids.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: production_umami_host_port_bindings
  changed_when: false

- name: Verify no Umami container publishes a host port
  ansible.builtin.assert:
    that:
      - >-
        (item.stdout | from_json) is none or
        ((item.stdout | from_json) | length == 0)
    fail_msg: "{{ item.item.item }} unexpectedly publishes a host port."
    quiet: true
  loop: "{{ production_umami_host_port_bindings.results }}"
  loop_control:
    label: "{{ item.item.item }}"

- name: Verify the Umami heartbeat from the application container
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - compose
      - --project-name
      - umami
      - --project-directory
      - "{{ production_umami_root }}"
      - --file
      - "{{ production_umami_root }}/compose.yml"
      - exec
      - -T
      - umami
      - curl
      - --fail
      - --silent
      - --show-error
      - http://127.0.0.1:3000/api/heartbeat
  changed_when: false

- name: Verify the database major version
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - compose
      - --project-name
      - umami
      - --project-directory
      - "{{ production_umami_root }}"
      - --file
      - "{{ production_umami_root }}/compose.yml"
      - exec
      - -T
      - db
      - postgres
      - --version
  register: production_umami_postgres_version
  changed_when: false
  failed_when: production_umami_postgres_version.stdout is not match('^postgres \\(PostgreSQL\\) 15\\.')

- name: Verify global 2FA remains required in Umami
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - compose
      - --project-name
      - umami
      - --project-directory
      - "{{ production_umami_root }}"
      - --file
      - "{{ production_umami_root }}/compose.yml"
      - exec
      - -T
      - db
      - psql
      - -U
      - "{{ production_umami_database_user }}"
      - -d
      - "{{ production_umami_database_name }}"
      - -Atc
      - SELECT value FROM app_setting WHERE key = 'twoFactorRequiredGlobal';
  register: production_umami_two_factor_required
  changed_when: false
  failed_when: production_umami_two_factor_required.stdout | trim != 'true'

- name: Verify the Caddy edge can reach Umami
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - compose
      - --project-directory
      - /var/www/_platform/caddy
      - --file
      - /var/www/_platform/caddy/compose.yml
      - exec
      - -T
      - caddy
      - wget
      - --quiet
      - --spider
      - http://umami:3000/api/heartbeat
  changed_when: false
