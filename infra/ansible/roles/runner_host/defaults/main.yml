---
runner_base_image_source: ""
runner_base_image_sha256: ""
runner_manager_source_root: "{{ playbook_dir }}/../.."
runner_allowed_repositories:
  - Tuinstra-DEV/gate
  - Tuinstra-DEV/wodiq-app
  - Tuinstra-DEV/wodiq-platform
  - Tuinstra-DEV/tracker
  - Tuinstra-DEV/notify
  - Tuinstra-DEV/console
  - Tuinstra-DEV/wodiq-site
  - Tuinstra-DEV/marcel-site
  - Tuinstra-DEV/tuinstra-site
runner_max_concurrency: 1
runner_pool_mode: legacy
runner_allow_pool_policy_transition: false
runner_vcpus: 4
runner_memory_mib: 6144
runner_medium_vcpus: 2
runner_medium_memory_mib: 3072
runner_max_heavy: 2
runner_max_medium: 2
runner_heavy_disk_reservation_gib: 12
runner_medium_disk_reservation_gib: 4
runner_host_memory_reserve_mib: 4096
runner_min_free_disk_gib: 60
runner_overlay_root: /var/lib/ci-runner/overlay
runner_overlay_mount_source: /dev/mapper/ubuntu--vg-ubuntu--lv
runner_bridge_name: virbr-ci
runner_network_cidr: 192.0.2.0/24
runner_production_networks_reviewed: false
runner_blocked_production_ipv4_cidrs: []
runner_blocked_production_ipv6_cidrs: []
