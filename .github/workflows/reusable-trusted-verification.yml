name: WODIQ Platform Verification

# Fixed WODIQ-only topology. Other consumers retain their existing immutable pin.
on:
  workflow_call:
    outputs:
      bundle-results-json:
        description: Actual per-suite route, result and exact-run identity
        value: ${{ toJSON(jobs) }}
      plan:
        description: Verified PR-diff plan
        value: ${{ jobs.preflight.outputs.plan }}
      selection:
        description: Ordered fixed-suite selection
        value: ${{ jobs.preflight.outputs.selection }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  preflight:
    name: Select and verify WODIQ checks
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      trusted: ${{ steps.identity.outputs.trusted }}
      source-sha: ${{ steps.identity.outputs.source-sha }}
      head-sha: ${{ steps.identity.outputs.head-sha }}
      base-sha: ${{ steps.identity.outputs.base-sha }}
      run-id: ${{ steps.identity.outputs.run-id }}
      run-attempt: ${{ steps.identity.outputs.run-attempt }}
      workflow-sha: ${{ steps.identity.outputs.workflow-sha }}
      medium-runner: ${{ steps.identity.outputs.medium-runner }}
      heavy-runner: ${{ steps.identity.outputs.heavy-runner }}
      plan: ${{ steps.select.outputs.plan }}
      selection: ${{ steps.select.outputs.selection }}
      selection-sha256: ${{ steps.contract.outputs.selection-sha256 }}
      selected-jobs: ${{ steps.contract.outputs.selected-jobs }}
    steps:
      - name: Bind current PR, source, run attempt and immutable workflow
        id: identity
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'IDENTITY'
          import json
          import os
          import re
          import urllib.request

          def require(ok, reason):
              if not ok:
                  raise SystemExit("bundle identity invalid: " + reason)

          def api(path):
              req = urllib.request.Request(
                  os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/") + path,
                  headers={"Accept": "application/vnd.github+json",
                           "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                           "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(req, timeout=10) as response:
                  return json.load(response)

          repo = os.environ["GITHUB_REPOSITORY"]
          require(repo == "Tuinstra-DEV/wodiq-platform", "repository allowlist")
          require(os.environ.get("GITHUB_EVENT_NAME") == "pull_request", "event")
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as file:
              event = json.load(file)
          pr_event = event.get("pull_request") or {}
          number = pr_event.get("number")
          head, base = pr_event.get("head") or {}, pr_event.get("base") or {}
          head_sha, base_sha, source_sha = head.get("sha"), base.get("sha"), os.environ.get("GITHUB_SHA")
          sha = lambda value: isinstance(value, str) and re.fullmatch(r"[0-9a-f]{40}", value)
          require(type(number) is int and number > 0 and all(map(sha, (head_sha, base_sha, source_sha))), "shas")
          require((event.get("repository") or {}).get("full_name") == repo and
                  (event.get("repository") or {}).get("private") is True, "repository")
          require(os.environ.get("GITHUB_REF") == f"refs/pull/{number}/merge", "ref")
          run_id, attempt = os.environ.get("GITHUB_RUN_ID", ""), os.environ.get("GITHUB_RUN_ATTEMPT", "")
          require(re.fullmatch(r"[1-9][0-9]*", run_id) and re.fullmatch(r"[1-9][0-9]*", attempt), "run")
          run = api(f"/repos/{repo}/actions/runs/{run_id}")
          require(run.get("id") == int(run_id) and run.get("run_attempt") == int(attempt) and
                  run.get("event") == "pull_request" and run.get("head_sha") == head_sha and
                  run.get("head_branch") == head.get("ref") and
                  (run.get("repository") or {}).get("full_name") == repo, "run record")
          prefix = "Tuinstra-DEV/devops/.github/workflows/reusable-trusted-verification.yml@"
          refs = [v for v in run.get("referenced_workflows", []) if isinstance(v, dict) and
                  isinstance(v.get("path"), str) and v["path"].startswith(prefix)]
          require(len(refs) == 1, "workflow reference count")
          workflow_sha = refs[0]["path"][len(prefix):]
          require(sha(workflow_sha) and refs[0].get("sha") == workflow_sha, "workflow pin")
          pr = api(f"/repos/{repo}/pulls/{number}")
          current_head, current_base = pr.get("head") or {}, pr.get("base") or {}
          require(pr.get("number") == number and pr.get("state") == "open" and
                  current_head.get("sha") == head_sha and current_base.get("sha") == base_sha and
                  (current_head.get("repo") or {}).get("full_name") ==
                  (head.get("repo") or {}).get("full_name") and
                  (current_base.get("repo") or {}).get("full_name") == repo, "current PR")
          merge = api(f"/repos/{repo}/git/commits/{source_sha}")
          parents = merge.get("parents") or []
          require(merge.get("sha") == source_sha and len(parents) == 2 and
                  {p.get("sha") for p in parents} == {head_sha, base_sha}, "merge parents")

          def trusted_user(value):
              return isinstance(value, dict) and value.get("login") == "marcel-tuinstra" and value.get("type") == "User"

          def same_private_repo(value):
              return isinstance(value, dict) and value.get("full_name") == repo and value.get("private") is True

          head_ref = head.get("ref")
          trusted = (
              repo == "Tuinstra-DEV/wodiq-platform"
              and os.environ.get("GITHUB_ACTOR") == "marcel-tuinstra"
              and os.environ.get("GITHUB_TRIGGERING_ACTOR") == "marcel-tuinstra"
              and trusted_user(event.get("sender")) and trusted_user(pr_event.get("user"))
              and trusted_user(run.get("actor")) and trusted_user(run.get("triggering_actor"))
              and trusted_user(pr.get("user"))
              and same_private_repo(run.get("head_repository"))
              and same_private_repo(head.get("repo")) and head["repo"].get("fork") is False
              and same_private_repo(base.get("repo"))
              and same_private_repo(current_head.get("repo")) and current_head["repo"].get("fork") is False
              and same_private_repo(current_base.get("repo"))
              and pr.get("merged") is False
              and isinstance(head_ref, str)
              and re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._/-]{0,254}", head_ref) is not None
              and ".." not in head_ref and "//" not in head_ref and not head_ref.endswith("/")
              and current_head.get("ref") == head_ref
          )
          if trusted:
              import urllib.parse
              associated = run.get("pull_requests")
              require(isinstance(associated, list) and len(associated) <= 1, "run PR association")
              if associated:
                  item = associated[0]
                  trusted = (isinstance(item, dict) and item.get("number") == number and
                             (item.get("head") or {}).get("sha") == head_sha and
                             (item.get("base") or {}).get("sha") == base_sha)
              else:
                  branch = urllib.parse.quote(f"{repo.split('/', 1)[0]}:{head_ref}", safe="")
                  candidates = api(f"/repos/{repo}/pulls?state=open&head={branch}&per_page=100")
                  trusted = (isinstance(candidates, list) and len(candidates) == 1 and
                             candidates[0].get("number") == number)
              if trusted:
                  encoded = urllib.parse.quote(head_ref, safe="/")
                  ref = api(f"/repos/{repo}/git/ref/heads/{encoded}")
                  trusted = (ref.get("ref") == "refs/heads/" + head_ref and
                             (ref.get("object") or {}).get("type") == "commit" and
                             (ref.get("object") or {}).get("sha") == head_sha)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("trusted=" + str(bool(trusted)).lower() + "\n")
              for name, value in (("source-sha", source_sha), ("head-sha", head_sha),
                                  ("base-sha", base_sha), ("run-id", run_id),
                                  ("run-attempt", attempt), ("workflow-sha", workflow_sha)):
                  out.write(f"{name}={value}\n")
              for profile in ("medium", "heavy"):
                  runner = {"group": "sanctuary-trusted-verification",
                            "labels": ["self-hosted", "trusted-" + profile, "sanctuary-wodiq-platform"]} if trusted else "ubuntu-24.04"
                  out.write(profile + "-runner=" + json.dumps(runner, separators=(",", ":")) + "\n")
          IDENTITY
      - name: Check out verified source history without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.identity.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Select checks from the verified diff
        id: select
        shell: bash
        env:
          BASE_SHA: ${{ steps.identity.outputs.base-sha }}
          HEAD_SHA: ${{ steps.identity.outputs.head-sha }}
          RELEASE_CANDIDATE: ${{ github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'develop' }}
        run: |
          if [[ "$RELEASE_CANDIDATE" == true ]]; then
            node scripts/ci/select-checks.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --release-candidate --github-output "$GITHUB_OUTPUT"
          else
            node scripts/ci/select-checks.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
          fi
      - name: Validate fixed plan and exact selection
        id: contract
        shell: bash
        env:
          PLAN: ${{ steps.select.outputs.plan }}
          SELECTION: ${{ steps.select.outputs.selection }}
          RELEASE_CANDIDATE: ${{ github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'develop' }}
        run: |
          python3 - <<'PLAN'
          import hashlib,json,os

          def require(ok, reason):
              if not ok: raise SystemExit("WODIQ plan rejected: " + reason)
          def unique(pairs):
              result = {}
              for key,value in pairs:
                  require(key not in result, "duplicate field")
                  result[key] = value
              return result
          require(len(os.environ["PLAN"].encode()) <= 4096 and len(os.environ["SELECTION"].encode()) <= 16384, "size")
          p = json.loads(os.environ["PLAN"], object_pairs_hook=unique)
          s = json.loads(os.environ["SELECTION"], object_pairs_hook=unique)
          checks = ("core","migration","api","management","worker","client")
          builds = ("api","management","worker")
          proofs = ("all","api","management","worker","activity","coach","managementAuth","garmin")
          require(type(p) is dict and set(p) == set(checks) | {"version","builds","proofs"} and type(p["version"]) is int and p["version"] == 3, "shape")
          for names, values in ((checks,p),(builds,p["builds"]),(proofs,p["proofs"])):
              require(type(values) is dict and (values is p or set(values) == set(names)) and all(type(values[k]) is bool for k in names), "booleans")
          require(not p["builds"]["worker"] or p["builds"]["management"], "worker build closure")
          require(not p["builds"]["management"] or p["builds"]["api"], "management build closure")
          for group in builds:
              require(not p[group] or p["builds"][group], "consumer build")
              require(not p["proofs"][group] or p[group], "component proof")
          families = {"api": ("api","activity","coach","garmin"), "management": ("management","managementAuth","garmin"), "worker": ("worker","garmin")}
          for group, names in families.items():
              require(not p[group] or p["proofs"]["all"] or any(p["proofs"][k] for k in names), "missing component integration proof")
          for proof, group in (("activity","api"),("coach","api"),("managementAuth","management")):
              require(not p["proofs"][proof] or p[group], "proof consumer")
          require(not p["proofs"]["garmin"] or all(p[k] for k in ("api","management","worker","client")) and p["proofs"]["activity"], "Garmin closure")
          require(not (p["proofs"]["activity"] or p["proofs"]["coach"]) or p["api"] and p["client"], "API/client closure")
          if p["proofs"]["all"] or os.environ["RELEASE_CANDIDATE"] == "true":
              require(p["proofs"]["all"] and all(p[k] for k in checks) and all(p["builds"].values()) and not any(p["proofs"][k] for k in proofs if k != "all"), "full release closure")
          require(not any(p[k] for k in checks) or any(p["proofs"].values()), "integration proof")
          keys = [key for key,active in (("wodiq-core",p["core"] or p["migration"] or p["client"]),("wodiq-runtime-build",any(p["builds"].values())),*(('wodiq-'+k,p[k]) for k in builds)) if active]
          expected = {"schemaVersion":1,"jobs":[{"job-key":k,"plan":p} for k in keys]}
          require(s == expected, "ordered selection or plan mismatch")
          canonical = json.dumps(s,sort_keys=True,separators=(",",":"),ensure_ascii=False)
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("selected-jobs="+json.dumps(keys,separators=(",",":"))+"\n")
              out.write("selection-sha256="+hashlib.sha256(canonical.encode()).hexdigest()+"\n")
          PLAN
      - name: Verify workspace and runtime environment boundaries
        run: npm run workspace:check && npm run test:runtime-environment
      - name: Verify CI policy and fail-closed selection
        run: npm run test:ci-workflow
      - name: Scan source for embedded secrets
        run: npm run scan:secrets

  wodiq-core:
    name: wodiq-core verification
    needs: preflight
    if: ${{ !cancelled() && needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.selected-jobs || '[]'), 'wodiq-core') }}
    runs-on: ${{ fromJSON(needs.preflight.outputs.medium-runner) }}
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      verified: ${{ steps.trusted.outputs.verified || steps.hosted.outputs.verified }}
      route: ${{ needs.preflight.outputs.trusted }}
    env:
      CI_PLAN: ${{ needs.preflight.outputs.plan }}
      CI_SOURCE_SHA: ${{ needs.preflight.outputs.source-sha }}
      CI_RUN_ID: ${{ github.run_id }}
      CI_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Run fixed trusted wodiq-core adapter
        if: needs.preflight.outputs.trusted == 'true'
        id: trusted
        uses: Tuinstra-DEV/devops/.github/actions/trusted-bundle-trusted@7c284a1b4405d844e581ad369b754885ab2415cc
        with:
          job-key: wodiq-core
          source-sha: ${{ needs.preflight.outputs.source-sha }}
          node-version: '24'
          pnpm-version: ''
          php-version: ''
          php-extensions: ''
          runtime-download: 'false'
          gate-frontend-output: 'false'
      - name: Run fixed hosted wodiq-core adapter
        if: needs.preflight.outputs.trusted == 'false'
        id: hosted
        uses: Tuinstra-DEV/devops/.github/actions/trusted-bundle-hosted@7c284a1b4405d844e581ad369b754885ab2415cc
        with:
          job-key: wodiq-core
          source-sha: ${{ needs.preflight.outputs.source-sha }}
          node-version: '24'
          pnpm-version: ''
          php-version: ''
          php-extensions: ''
          runtime-download: 'false'
          gate-frontend-output: 'false'

  wodiq-runtime-build:
    name: wodiq-runtime-build verification
    needs: preflight
    if: ${{ !cancelled() && needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.selected-jobs || '[]'), 'wodiq-runtime-build') }}
    runs-on: ${{ fromJSON(needs.preflight.outputs.medium-runner) }}
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      verified: ${{ steps.trusted.outputs.verified || steps.hosted.outputs.verified }}
      route: ${{ needs.preflight.outputs.trusted }}
    env:
      CI_PLAN: ${{ needs.preflight.outputs.plan }}
      CI_SOURCE_SHA: ${{ needs.preflight.outputs.source-sha }}
      CI_RUN_ID: ${{ github.run_id }}
      CI_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Run fixed trusted wodiq-runtime-build adapter
        if: needs.preflight.outputs.trusted == 'true'
        id: trusted
        uses: Tuinstra-DEV/devops/.github/actions/trusted-bundle-trusted@7c284a1b4405d844e581ad369b754885ab2415cc
        with:
          job-key: wodiq-runtime-build
          source-sha: ${{ needs.preflight.outputs.source-sha }}
          node-version: '24'
          pnpm-version: ''
          php-version: ''
          php-extensions: ''
          runtime-download: 'false'
          gate-frontend-output: 'false'
      - name: Run fixed hosted wodiq-runtime-build adapter
        if: needs.preflight.outputs.trusted == 'false'
        id: hosted
        uses: Tuinstra-DEV/devops/.github/actions/trusted-bundle-hosted@7c284a1b4405d844e581ad369b754885ab2415cc
        with:
          job-key: wodiq-runtime-build
          source-sha: ${{ needs.preflight.outputs.source-sha }}
          node-version: '24'
          pnpm-version: ''
          php-version: ''
          php-extensions: ''
          runtime-download: 'false'
          gate-frontend-output: 'false'

  wodiq-api:
    name: wodiq-api verification
    needs: [preflight, wodiq-runtime-build]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.selected-jobs || '[]'), 'wodiq-api') && needs.wodiq-runtime-build.result == 'success' && needs.wodiq-runtime-build.outputs.verified == 'true' && needs.wodiq-runtime-build.outputs.route == needs.preflight.outputs.trusted }}
    runs-on: ${{ fromJSON(needs.preflight.outputs.heavy-runner) }}
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      verified: ${{ steps.trusted.outputs.verified || steps.hosted.outputs.verified }}
      route: ${{ needs.preflight.outputs.trusted }}
    env:
      CI_PLAN: ${{ needs.preflight.outputs.plan }}
      CI_SOURCE_SHA: ${{ needs.preflight.outputs.source-sha }}
      CI_RUN_ID: ${{ github.run_id }}
      CI_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Run fixed trusted wodiq-api adapter
        if: needs.preflight.outputs.trusted == 'true'
        id: trusted
        uses: Tuinstra-DEV/devops/.github/actions/trusted-bundle-trusted@7c284a1b4405d844e581ad369b754885ab2415cc
        with:
          job-key: wodiq-api
          source-sha: ${{ needs.preflight.outputs.source-sha }}
          node-version: '24'
          pnpm-version: ''
          php-version: ''
          php-extensions: ''
          runtime-download: ${{ fromJSON(needs.preflight.outputs.plan).builds.api }}
          gate-frontend-output: 'false'
      - name: Run fixed hosted wodiq-api adapter
        if: needs.preflight.outputs.trusted == 'false'
        id: hosted
        uses: Tuinstra-DEV/devops/.github/actions/trusted-bundle-hosted@7c284a1b4405d844e581ad369b754885ab2415cc
        with:
          job-key: wodiq-api
          source-sha: ${{ needs.preflight.outputs.source-sha }}
          node-version: '24'
          pnpm-version: ''
          php-version: ''
          php-extensions: ''
          runtime-download: ${{ fromJSON(needs.preflight.outputs.plan).builds.api }}
          gate-frontend-output: 'false'

  wodiq-management:
    name: wodiq-management verification
    needs: [preflight, wodiq-runtime-build]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.selected-jobs || '[]'), 'wodiq-management') && needs.wodiq-runtime-build.result == 'success' && needs.wodiq-runtime-build.outputs.verified == 'true' && needs.wodiq-runtime-build.outputs.route == needs.preflight.outputs.trusted }}
    runs-on: ${{ fromJSON(needs.preflight.outputs.heavy-runner) }}
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      verified: ${{ steps.trusted.outputs.verified || steps.hosted.outputs.verified }}
      route: ${{ needs.preflight.outputs.trusted }}
    env:
      CI_PLAN: ${{ needs.preflight.outputs.plan }}
      CI_SOURCE_SHA: ${{ needs.preflight.outputs.source-sha }}
      CI_RUN_ID: ${{ github.run_id }}
      CI_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Run fixed trusted wodiq-management adapter
        if: needs.preflight.outputs.trusted == 'true'
        id: trusted
        uses: Tuinstra-DEV/devops/.github/actions/trusted-bundle-trusted@7c284a1b4405d844e581ad369b754885ab2415cc
        with:
          job-key: wodiq-management
          source-sha: ${{ needs.preflight.outputs.source-sha }}
          node-version: '24'
          pnpm-version: ''
          php-version: ''
          php-extensions: ''
          runtime-download: ${{ fromJSON(needs.preflight.outputs.plan).builds.management }}
          gate-frontend-output: 'false'
      - name: Run fixed hosted wodiq-management adapter
        if: needs.preflight.outputs.trusted == 'false'
        id: hosted
        uses: Tuinstra-DEV/devops/.github/actions/trusted-bundle-hosted@7c284a1b4405d844e581ad369b754885ab2415cc
        with:
          job-key: wodiq-management
          source-sha: ${{ needs.preflight.outputs.source-sha }}
          node-version: '24'
          pnpm-version: ''
          php-version: ''
          php-extensions: ''
          runtime-download: ${{ fromJSON(needs.preflight.outputs.plan).builds.management }}
          gate-frontend-output: 'false'

  wodiq-worker:
    name: wodiq-worker verification
    needs: [preflight, wodiq-runtime-build]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && contains(fromJSON(needs.preflight.outputs.selected-jobs || '[]'), 'wodiq-worker') && needs.wodiq-runtime-build.result == 'success' && needs.wodiq-runtime-build.outputs.verified == 'true' && needs.wodiq-runtime-build.outputs.route == needs.preflight.outputs.trusted }}
    runs-on: ${{ fromJSON(needs.preflight.outputs.heavy-runner) }}
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      verified: ${{ steps.trusted.outputs.verified || steps.hosted.outputs.verified }}
      route: ${{ needs.preflight.outputs.trusted }}
    env:
      CI_PLAN: ${{ needs.preflight.outputs.plan }}
      CI_SOURCE_SHA: ${{ needs.preflight.outputs.source-sha }}
      CI_RUN_ID: ${{ github.run_id }}
      CI_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Run fixed trusted wodiq-worker adapter
        if: needs.preflight.outputs.trusted == 'true'
        id: trusted
        uses: Tuinstra-DEV/devops/.github/actions/trusted-bundle-trusted@7c284a1b4405d844e581ad369b754885ab2415cc
        with:
          job-key: wodiq-worker
          source-sha: ${{ needs.preflight.outputs.source-sha }}
          node-version: '24'
          pnpm-version: ''
          php-version: ''
          php-extensions: ''
          runtime-download: ${{ fromJSON(needs.preflight.outputs.plan).builds.worker }}
          gate-frontend-output: 'false'
      - name: Run fixed hosted wodiq-worker adapter
        if: needs.preflight.outputs.trusted == 'false'
        id: hosted
        uses: Tuinstra-DEV/devops/.github/actions/trusted-bundle-hosted@7c284a1b4405d844e581ad369b754885ab2415cc
        with:
          job-key: wodiq-worker
          source-sha: ${{ needs.preflight.outputs.source-sha }}
          node-version: '24'
          pnpm-version: ''
          php-version: ''
          php-extensions: ''
          runtime-download: ${{ fromJSON(needs.preflight.outputs.plan).builds.worker }}
          gate-frontend-output: 'false'
