name: Reusable Trusted Verification

# Consumers must invoke this workflow at an exact commit SHA. The fixed adapter
# is part of the checked-out consumer repository; callers cannot supply a shell
# command, runner label, path, token, or trust assertion.
on:
  workflow_call:
    inputs:
      profile:
        description: Fixed Sanctuary capacity profile (medium or heavy)
        required: true
        type: string
      job-key:
        description: Slug selecting a fixed job inside the consumer adapter
        required: true
        type: string
      plan-json:
        description: Strict selection booleans or enums for fixed WODIQ, Gate and Tracker frontend adapters
        required: false
        default: ""
        type: string
    outputs:
      preflight-trusted:
        description: Server-side trust route decision
        value: ${{ jobs.preflight.outputs.trusted }}
      trusted-proof:
        description: True only after the trusted adapter completes successfully
        value: ${{ jobs.trusted-verification.outputs.verified }}
      hosted-proof:
        description: True only after the hosted fallback adapter completes successfully
        value: ${{ jobs.hosted-fallback.outputs.verified }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  preflight:
    name: Verify current PR and run on GitHub
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      trusted: ${{ steps.trust.outputs.trusted }}
      source-sha: ${{ steps.trust.outputs.source-sha }}
      head-sha: ${{ steps.trust.outputs.head-sha }}
      runner-labels: ${{ steps.trust.outputs.runner-labels }}
      reason: ${{ steps.trust.outputs.reason }}
      node-version: ${{ steps.contract.outputs.node-version }}
      pnpm-version: ${{ steps.contract.outputs.pnpm-version }}
      php-version: ${{ steps.contract.outputs.php-version }}
      php-extensions: ${{ steps.contract.outputs.php-extensions }}
      plan-json: ${{ steps.contract.outputs.plan-json }}
      runtime-download: ${{ steps.contract.outputs.runtime-download }}
      gate-frontend-output: ${{ steps.contract.outputs.gate-frontend-output }}
    steps:
      - name: Validate inputs and server-side trust
        id: trust
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          JOB_KEY: ${{ inputs.job-key }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          REPO_LABELS = {
              "Tuinstra-DEV/console": "sanctuary-console",
              "Tuinstra-DEV/gate": "sanctuary-gate",
              "Tuinstra-DEV/marcel-site": "sanctuary-marcel-site",
              "Tuinstra-DEV/notify": "sanctuary-notify",
              "Tuinstra-DEV/openairco": "sanctuary-openairco",
              "Tuinstra-DEV/openairco-site": "sanctuary-openairco-site",
              "Tuinstra-DEV/status": "sanctuary-status",
              "Tuinstra-DEV/tracker": "sanctuary-tracker",
              "Tuinstra-DEV/tuinstra-site": "sanctuary-tuinstra-site",
              "Tuinstra-DEV/wodiq-app": "sanctuary-wodiq-app",
              "Tuinstra-DEV/wodiq-platform": "sanctuary-wodiq-platform",
              "Tuinstra-DEV/wodiq-site": "sanctuary-wodiq-site",
          }
          TRUSTED_LOGIN = "marcel-tuinstra"

          class Untrusted(Exception):
              pass

          def require(condition, reason):
              if not condition:
                  raise Untrusted(reason)

          def api(path):
              root = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
              request = urllib.request.Request(
                  root + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=10) as response:
                  return json.load(response)

          def same_private_repo(repo, expected):
              return isinstance(repo, dict) and repo.get("full_name") == expected and repo.get("private") is True

          def user(value):
              return isinstance(value, dict) and value.get("login") == TRUSTED_LOGIN and value.get("type") == "User"

          def output(trusted, reason, source_sha="", head_sha="", labels=None):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                  out.write("trusted=" + ("true" if trusted else "false") + "\n")
                  out.write("reason=" + reason + "\n")
                  out.write("source-sha=" + source_sha + "\n")
                  out.write("head-sha=" + head_sha + "\n")
                  out.write("runner-labels=" + json.dumps(labels or [], separators=(",", ":")) + "\n")

          def main():
              profile = os.environ["PROFILE"]
              key = os.environ["JOB_KEY"]
              if profile not in ("medium", "heavy") or not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", key) or len(key) > 48:
                  raise SystemExit("invalid fixed profile or job-key contract")
              try:
                  repo = os.environ.get("GITHUB_REPOSITORY", "")
                  require(repo in REPO_LABELS, "repo-not-allowlisted")
                  require(os.environ.get("GITHUB_EVENT_NAME") == "pull_request", "non-pr-event")
                  require(os.environ.get("GITHUB_ACTOR") == TRUSTED_LOGIN, "actor-mismatch")
                  require(os.environ.get("GITHUB_TRIGGERING_ACTOR") == TRUSTED_LOGIN, "triggering-actor-mismatch")
                  with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
                      event = json.load(source)
                  require(same_private_repo(event.get("repository"), repo), "event-repo-mismatch")
                  require(user(event.get("sender")), "sender-mismatch")
                  event_pr = event.get("pull_request") or {}
                  number = event_pr.get("number")
                  require(type(number) is int and number > 0, "event-pr-missing")
                  require(user(event_pr.get("user")), "event-author-mismatch")
                  event_head, event_base = event_pr.get("head") or {}, event_pr.get("base") or {}
                  event_sha = event_head.get("sha")
                  require(isinstance(event_sha, str) and re.fullmatch(r"[0-9a-f]{40}", event_sha), "event-sha-invalid")
                  require(same_private_repo(event_head.get("repo"), repo) and
                          event_head["repo"].get("fork") is False and
                          same_private_repo(event_base.get("repo"), repo), "event-fork-or-repo")
                  head_ref = event_head.get("ref")
                  require(isinstance(head_ref, str) and
                          re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._/-]{0,254}", head_ref) is not None and
                          ".." not in head_ref and "//" not in head_ref and not head_ref.endswith("/"),
                          "event-ref-invalid")
                  run_id = os.environ.get("GITHUB_RUN_ID", "")
                  require(re.fullmatch(r"[0-9]+", run_id) is not None, "run-id-invalid")
                  run = api(f"/repos/{repo}/actions/runs/{run_id}")
                  require(run.get("id") == int(run_id) and run.get("event") == "pull_request" and
                          run.get("head_sha") == event_sha and user(run.get("actor")) and
                          user(run.get("triggering_actor")) and
                          same_private_repo(run.get("repository"), repo) and
                          same_private_repo(run.get("head_repository"), repo), "run-mismatch")
                  require(run.get("head_branch") == head_ref, "run-head-branch-mismatch")
                  central = "Tuinstra-DEV/devops/.github/workflows/reusable-trusted-verification.yml@"
                  references = [item for item in (run.get("referenced_workflows") or [])
                                if isinstance(item, dict) and
                                isinstance(item.get("path"), str) and
                                item["path"].startswith(central.rsplit("@", 1)[0] + "@")]
                  require(len(references) == 1 and
                          re.fullmatch(r"[0-9a-f]{40}", references[0]["path"][len(central):]) is not None and
                          references[0].get("sha") == references[0]["path"][len(central):],
                          "workflow-not-pinned")
                  associated = run.get("pull_requests")
                  require(isinstance(associated, list) and len(associated) <= 1, "run-pr-mismatch")
                  # GitHub can return an empty association for an exact PR run. The
                  # manager admits only a unique open PR for the source branch.
                  if associated:
                      item = associated[0]
                      require(isinstance(item, dict) and type(item.get("number")) is int and
                              item["number"] == number and
                              (item.get("head") or {}).get("sha") == event_sha and
                              (item.get("base") or {}).get("sha") == event_base.get("sha"),
                              "run-pr-mismatch")
                  else:
                      owner = repo.split("/", 1)[0]
                      branch_query = urllib.parse.quote(f"{owner}:{head_ref}", safe="")
                      candidates = api(f"/repos/{repo}/pulls?state=open&head={branch_query}&per_page=100")
                      require(isinstance(candidates, list) and len(candidates) == 1 and
                              isinstance(candidates[0], dict) and
                              type(candidates[0].get("number")) is int and
                              candidates[0]["number"] == number, "run-pr-ambiguous")
                  pr = api(f"/repos/{repo}/pulls/{number}")
                  head, base = pr.get("head") or {}, pr.get("base") or {}
                  require(pr.get("number") == number and pr.get("state") == "open" and
                          pr.get("merged") is False and user(pr.get("user")) and
                          head.get("sha") == event_sha and head.get("ref") == head_ref and
                          base.get("sha") == event_base.get("sha") and
                          same_private_repo(head.get("repo"), repo) and
                          head["repo"].get("fork") is False and
                          same_private_repo(base.get("repo"), repo), "current-pr-mismatch")
                  encoded_ref = urllib.parse.quote(head_ref, safe="/")
                  current_ref = api(f"/repos/{repo}/git/ref/heads/{encoded_ref}")
                  require(current_ref.get("ref") == "refs/heads/" + head_ref and
                          (current_ref.get("object") or {}).get("type") == "commit" and
                          current_ref["object"].get("sha") == event_sha, "stale-head")
                  merge_sha = os.environ.get("GITHUB_SHA", "")
                  require(re.fullmatch(r"[0-9a-f]{40}", merge_sha) is not None and
                          os.environ.get("GITHUB_REF") == f"refs/pull/{number}/merge", "merge-context-invalid")
                  merge = api(f"/repos/{repo}/git/commits/{merge_sha}")
                  parents = merge.get("parents") or []
                  require(merge.get("sha") == merge_sha and len(parents) == 2 and
                          {item.get("sha") for item in parents} == {event_base.get("sha"), event_sha},
                          "merge-parents-mismatch")
                  output(True, "verified", merge_sha, event_sha,
                         ["self-hosted", "trusted-" + profile, REPO_LABELS[repo]])
              except Untrusted as failure:
                  output(False, str(failure))
              except (OSError, ValueError, KeyError, TypeError, TimeoutError):
                  output(False, "api-unavailable")

          main()
          PY
      - name: Validate fixed consumer contract
        id: contract
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          JOB_KEY: ${{ inputs.job-key }}
          PLAN_JSON: ${{ inputs.plan-json }}
        run: |
          python3 - <<'CONTRACT'
          import json
          import os

          # The tuple is (capacity profile, Node, pnpm, PHP, PHP extensions).
          # No caller-controlled command, path, toolchain, or service is accepted.
          jobs = {
              "Tuinstra-DEV/wodiq-platform": {
                  "wodiq-runtime-build": ("medium", "24", "", "", ""),
                  "wodiq-core": ("medium", "24", "", "", ""),
                  "wodiq-migration": ("medium", "24", "", "", ""),
                  "wodiq-client": ("medium", "24", "", "", ""),
                  "wodiq-api": ("heavy", "24", "", "", ""),
                  "wodiq-management": ("heavy", "24", "", "", ""),
                  "wodiq-worker": ("heavy", "24", "", "", ""),
              },
              "Tuinstra-DEV/gate": {
                  "gate-php": ("medium", "", "", "8.3", "ctype, iconv"),
                  "gate-frontend-static": ("heavy", "24", "10.28.2", "", ""),
              },
              "Tuinstra-DEV/tracker": {
                  "tracker-backend-postgres": ("heavy", "", "", "8.4", "ctype, fileinfo, iconv, intl, mbstring, openssl, pdo_pgsql, zip"),
                  "tracker-frontend-static": ("medium", "24.18.0", "11.1.1", "", ""),
                  "tracker-container-api": ("heavy", "24.18.0", "", "", ""),
                  "tracker-container-web": ("heavy", "24.18.0", "", "", ""),
                  "tracker-container-php-prod": ("heavy", "24.18.0", "", "", ""),
                  "tracker-container-nginx-prod": ("heavy", "24.18.0", "", "", ""),
              },
              "Tuinstra-DEV/notify": {
                  "notify-quality": ("heavy", "", "", "", ""),
                  "notify-production-images": ("heavy", "", "", "", ""),
              },
              "Tuinstra-DEV/console": {
                  "console-php-lint": ("medium", "", "", "8.4", "intl, pdo_pgsql"),
                  "console-php-postgres": ("heavy", "", "", "8.4", "intl, pdo_pgsql"),
              },
              "Tuinstra-DEV/marcel-site": {
                  "site-node": ("medium", "24", "", "", ""),
              },
              "Tuinstra-DEV/tuinstra-site": {
                  "site-node": ("medium", "24", "", "", ""),
              },
              "Tuinstra-DEV/wodiq-site": {
                  "site-node": ("medium", "24", "", "", ""),
              },
              "Tuinstra-DEV/openairco-site": {
                  "site-node": ("medium", "24", "", "", ""),
              },
              "Tuinstra-DEV/wodiq-app": {
                  "wodiq-app-checks": ("heavy", "24", "", "", ""),
              },
              "Tuinstra-DEV/status": {
                  "status-quality": ("heavy", "", "", "", ""),
              },
              "Tuinstra-DEV/openairco": {
                  "openairco-flutter": ("heavy", "", "", "", ""),
              },
          }
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          key = os.environ["JOB_KEY"]
          contract = jobs.get(repo, {}).get(key)
          if contract is None or os.environ["PROFILE"] != contract[0]:
              raise SystemExit("unsupported repository, job-key, or capacity profile")

          raw = os.environ["PLAN_JSON"]
          if repo == "Tuinstra-DEV/wodiq-platform":
              if len(raw) > 4096:
                  raise SystemExit("WODIQ plan exceeds the fixed contract size")
              try:
                  plan = json.loads(raw)
              except (ValueError, TypeError):
                  raise SystemExit("WODIQ plan must be JSON") from None
              checks = {"core", "migration", "api", "management", "worker", "client"}
              builds = {"api", "management", "worker"}
              proofs = {"all", "activity", "coach", "managementAuth", "garmin"}
              if (type(plan) is not dict or set(plan) != checks | {"version", "builds", "proofs"}
                      or type(plan.get("version")) is not int or plan["version"] != 2
                      or type(plan.get("builds")) is not dict or set(plan["builds"]) != builds
                      or type(plan.get("proofs")) is not dict or set(plan["proofs"]) != proofs
                      or any(type(plan[name]) is not bool for name in checks)
                      or any(type(plan["builds"][name]) is not bool for name in builds)
                      or any(type(plan["proofs"][name]) is not bool for name in proofs)):
                  raise SystemExit("WODIQ plan has an unsupported shape")
          elif repo == "Tuinstra-DEV/gate":
              if len(raw) > 256:
                  raise SystemExit("Gate plan exceeds the fixed contract size")
              try:
                  plan = json.loads(raw)
              except (ValueError, TypeError):
                  raise SystemExit("Gate plan must be JSON") from None
              if key == "gate-php":
                  suites = {"Unit", "Integration", "Functional", "Unit,Integration", "Unit,Functional",
                            "Integration,Functional", "Unit,Integration,Functional"}
                  if (type(plan) is not dict or set(plan) != {"backendSuites"}
                          or type(plan["backendSuites"]) is not str or plan["backendSuites"] not in suites):
                      raise SystemExit("invalid Gate PHP suite selection")
              elif (type(plan) is not dict or set(plan) != {"frontendTests", "frontendBuild"}
                    or type(plan["frontendTests"]) is not str
                    or plan["frontendTests"] not in {"all", "unit", "functional"}
                    or type(plan["frontendBuild"]) is not bool):
                  raise SystemExit("invalid Gate frontend selection")
          elif repo == "Tuinstra-DEV/tracker" and key == "tracker-frontend-static":
              keys = ("frontend-web", "frontend-unit", "frontend-component", "frontend-site")
              if not raw:
                  plan = dict.fromkeys(keys, True)
              else:
                  if len(raw) > 256:
                      raise SystemExit("Tracker plan exceeds the fixed contract size")
                  try:
                      plan = json.loads(raw)
                  except (ValueError, TypeError):
                      raise SystemExit("Tracker plan must be JSON") from None
              if (type(plan) is not dict or set(plan) != set(keys)
                      or any(type(plan[name]) is not bool for name in keys)
                      or not (plan["frontend-web"] or plan["frontend-site"])
                      or (plan["frontend-unit"] and not plan["frontend-web"])
                      or (plan["frontend-component"] and not plan["frontend-web"])):
                  raise SystemExit("invalid Tracker frontend selection")
          else:
              if raw:
                  raise SystemExit("this fixed adapter does not accept a plan")
              plan = None

          runtime_download = (repo == "Tuinstra-DEV/wodiq-platform" and
                              key in {"wodiq-api", "wodiq-management", "wodiq-worker"} and
                              plan["builds"][key.removeprefix("wodiq-")])
          gate_frontend_output = (repo == "Tuinstra-DEV/gate" and key == "gate-frontend-static" and
                                  plan["frontendBuild"])

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for name, value in zip(("node-version", "pnpm-version", "php-version", "php-extensions"), contract[1:]):
                  out.write(f"{name}={value}\n")
              out.write("plan-json=" + (json.dumps(plan, separators=(",", ":")) if plan is not None else "") + "\n")
              out.write("runtime-download=" + str(runtime_download).lower() + "\n")
              out.write("gate-frontend-output=" + str(gate_frontend_output).lower() + "\n")
          CONTRACT

  trusted-verification:
    name: Trusted verification
    permissions:
      contents: read
    needs: preflight
    if: ${{ needs.preflight.outputs.trusted == 'true' && github.event_name == 'pull_request' && github.actor == 'marcel-tuinstra' && github.triggering_actor == 'marcel-tuinstra' && github.event.repository.private == true && github.event.sender.login == 'marcel-tuinstra' && github.event.sender.type == 'User' && github.event.pull_request.user.login == 'marcel-tuinstra' && github.event.pull_request.user.type == 'User' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.private == true && github.event.pull_request.base.repo.full_name == github.repository && github.event.pull_request.base.repo.private == true && !github.event.pull_request.head.repo.fork && github.event.pull_request.head.sha == needs.preflight.outputs.head-sha && github.sha == needs.preflight.outputs.source-sha }}
    outputs:
      verified: ${{ steps.proof.outputs.verified }}
    runs-on:
      group: sanctuary-trusted-verification
      labels: ${{ fromJSON(needs.preflight.outputs.runner-labels) }}
    timeout-minutes: 60
    env:
      CI_PLAN: ${{ needs.preflight.outputs.plan-json }}
      CI_SOURCE_SHA: ${{ needs.preflight.outputs.source-sha }}
      CI_RUN_ID: ${{ github.run_id }}
      CI_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Checkout exact verified PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ needs.preflight.outputs.source-sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up pinned pnpm
        if: ${{ needs.preflight.outputs.pnpm-version != '' }}
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: ${{ needs.preflight.outputs.pnpm-version }}
      - name: Set up Node.js for fixed npm consumers
        if: ${{ github.repository == 'Tuinstra-DEV/wodiq-platform' || github.repository == 'Tuinstra-DEV/wodiq-app' || github.repository == 'Tuinstra-DEV/marcel-site' || github.repository == 'Tuinstra-DEV/tuinstra-site' || github.repository == 'Tuinstra-DEV/wodiq-site' || github.repository == 'Tuinstra-DEV/openairco-site' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.2.0
        with:
          node-version: ${{ needs.preflight.outputs.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up Gate Node.js with pinned pnpm download cache
        if: ${{ github.repository == 'Tuinstra-DEV/gate' && inputs.job-key == 'gate-frontend-static' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.2.0
        with:
          node-version: ${{ needs.preflight.outputs.node-version }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Set up Tracker Node.js with pinned pnpm download cache
        if: ${{ github.repository == 'Tuinstra-DEV/tracker' && inputs.job-key == 'tracker-frontend-static' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.2.0
        with:
          node-version: ${{ needs.preflight.outputs.node-version }}
          cache: pnpm
          cache-dependency-path: |
            code/web/pnpm-lock.yaml
            code/site/pnpm-lock.yaml
      - name: Set up Node.js for fixed Tracker image contracts
        if: ${{ github.repository == 'Tuinstra-DEV/tracker' && startsWith(inputs.job-key, 'tracker-container-') }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.2.0
        with:
          node-version: ${{ needs.preflight.outputs.node-version }}
      - name: Set up PHP and Composer
        if: ${{ needs.preflight.outputs.php-version != '' }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ needs.preflight.outputs.php-version }}
          extensions: ${{ needs.preflight.outputs.php-extensions }}
          tools: composer:v2
          coverage: none
        env:
          fast-fail: true
      - name: Resolve fixed Composer download cache
        if: ${{ needs.preflight.outputs.php-version != '' }}
        id: composer-cache
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" == 'Tuinstra-DEV/tracker' && "$RUNNER_ENVIRONMENT" == 'self-hosted' ]]; then
            cache_path="$RUNNER_TEMP/composer-cache"
          else
            cache_path="$(composer config cache-files-dir)"
          fi
          mkdir -p "$cache_path"
          echo "path=$cache_path" >> "$GITHUB_OUTPUT"
          echo "COMPOSER_CACHE_DIR=$cache_path" >> "$GITHUB_ENV"
      - name: Restore Gate Composer downloads
        if: ${{ github.repository == 'Tuinstra-DEV/gate' && inputs.job-key == 'gate-php' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.path }}
          key: gate-${{ runner.os }}-${{ runner.arch }}-php83-composer-${{ hashFiles('backend/composer.lock') }}
      - name: Restore Tracker Composer downloads
        if: ${{ github.repository == 'Tuinstra-DEV/tracker' && inputs.job-key == 'tracker-backend-postgres' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.path }}
          key: tracker-${{ runner.os }}-${{ runner.arch }}-php84-composer-${{ hashFiles('code/api/composer.lock') }}
      - name: Restore Console Composer downloads
        if: ${{ github.repository == 'Tuinstra-DEV/console' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.path }}
          key: console-${{ runner.os }}-${{ runner.arch }}-php84-composer-${{ hashFiles('composer.lock') }}
      - name: Set up Docker Buildx for fixed image checks
        if: ${{ (github.repository == 'Tuinstra-DEV/tracker' && startsWith(inputs.job-key, 'tracker-container-')) || github.repository == 'Tuinstra-DEV/notify' || github.repository == 'Tuinstra-DEV/status' }}
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0
      - name: Bind fixed PR Docker layer cache to source and engine
