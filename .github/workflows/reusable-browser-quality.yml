name: Reusable Browser Quality

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_call:
    inputs:
      execution-class:
        description: Deprecated compatibility input; qualifying browser jobs always use Sanctuary
        required: false
        default: hosted
        type: string
      node-version:
        description: Node.js version used for the browser suite
        required: false
        default: "24"
        type: string
      workdir:
        description: Working directory containing package-lock.json
        required: false
        default: "."
        type: string
      browser:
        description: "Playwright browser: chromium, firefox, or webkit"
        required: false
        default: chromium
        type: string
      test-script:
        description: npm package script that executes the browser suite
        required: false
        default: test:ui
        type: string
      report-path:
        description: Repository-relative path produced by the browser reporter
        required: false
        default: playwright-report
        type: string
      artifact-retention-days:
        description: Number of days to retain the browser report
        required: false
        default: 14
        type: number
    outputs:
      report-artifact:
        description: Deterministic browser report artifact name
        value: ${{ jobs['browser-quality'].outputs['report-artifact'] }}

# The policy job stays on GitHub-hosted infrastructure. Only a trusted release
# candidate can make the browser job eligible for the Sanctuary runner.
jobs:
  release-policy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      run-browser: ${{ steps.policy.outputs.run-browser }}
    steps:
      - name: Validate release browser policy
        id: policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          REPOSITORY: ${{ github.repository }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork || false }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type || '' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request || "$BASE_REF" != main || "$HEAD_REF" != develop ]]; then
            echo 'run-browser=false' >> "$GITHUB_OUTPUT"
            echo 'Browser suite skipped: only develop-to-main pull requests run browser tests.'
            exit 0
          fi
          if [[ "$IS_FORK" != false || "$HEAD_REPOSITORY" != "$REPOSITORY" || "$PR_AUTHOR_TYPE" != User || "$ACTOR" = *'[bot]' || "$TRIGGERING_ACTOR" = *'[bot]' ]]; then
            echo 'run-browser=false' >> "$GITHUB_OUTPUT"
            echo 'Release browser suite requires a same-repository release PR triggered and authored by a human.' >&2
            exit 2
          fi
          echo 'run-browser=true' >> "$GITHUB_OUTPUT"

  browser-quality:
    if: ${{ needs.release-policy.outputs.run-browser == 'true' && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.head.repo.fork && github.event.pull_request.user.type == 'User' && !endsWith(github.actor, '[bot]') && !endsWith(github.triggering_actor, '[bot]') }}
    needs: release-policy
    runs-on: [self-hosted, trusted-heavy]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.workdir }}
    outputs:
      report-artifact: ${{ steps.contract.outputs['report-artifact'] }}
    steps:
      - name: Validate contract inputs
        id: contract
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          EXECUTION_CLASS: ${{ inputs['execution-class'] }}
          WORKDIR: ${{ inputs.workdir }}
          BROWSER: ${{ inputs.browser }}
          TEST_SCRIPT: ${{ inputs['test-script'] }}
          REPORT_PATH: ${{ inputs['report-path'] }}
          RETENTION_DAYS: ${{ inputs['artifact-retention-days'] }}
        run: |
          set -euo pipefail
          case "$EXECUTION_CLASS" in hosted|trusted-heavy) ;; *) echo "execution-class must be hosted or trusted-heavy" >&2; exit 2 ;; esac
          case "$BROWSER" in chromium|firefox|webkit) ;; *) echo "browser must be chromium, firefox, or webkit" >&2; exit 2 ;; esac
          if [[ ! "$TEST_SCRIPT" =~ ^[A-Za-z0-9:_-]+$ ]]; then
            echo "test-script must be an npm script name, not a shell command" >&2
            exit 2
          fi
          for path in "$WORKDIR" "$REPORT_PATH"; do
            if [[ -z "$path" || "$path" = /* || "$path" =~ (^|/)\.\.(/|$) ]]; then
              echo "workdir and report-path must be non-empty repository-relative paths without '..'" >&2
              exit 2
            fi
          done
          if (( RETENTION_DAYS < 1 || RETENTION_DAYS > 90 )); then
            echo "artifact-retention-days must be between 1 and 90" >&2
            exit 2
          fi
          echo "report-artifact=browser-quality-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.2.0
        with:
          node-version: ${{ inputs['node-version'] }}
          cache: npm
          cache-dependency-path: ${{ inputs.workdir }}/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      # Sanctuary images provision browser and OS packages. Never run apt or
      # Playwright's privileged --with-deps installer on a persistent runner.
      - name: Install requested Playwright browser
        env:
          BROWSER: ${{ inputs.browser }}
        run: ./node_modules/.bin/playwright install "$BROWSER"

      - name: Run browser quality suite
        env:
          TEST_SCRIPT: ${{ inputs['test-script'] }}
        run: npm run "$TEST_SCRIPT"

      - name: Upload deterministic browser report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.contract.outputs['report-artifact'] }}
          path: ${{ inputs.workdir }}/${{ inputs['report-path'] }}
          if-no-files-found: error
          retention-days: ${{ inputs['artifact-retention-days'] }}
          compression-level: 9

  release-verdict:
    if: ${{ always() }}
    needs: [release-policy, browser-quality]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require the expected trusted release browser result
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          REPOSITORY: ${{ github.repository }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork || false }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type || '' }}
          POLICY_RESULT: ${{ needs.release-policy.result }}
          POLICY_RUN_BROWSER: ${{ needs.release-policy.outputs.run-browser || 'false' }}
          BROWSER_RESULT: ${{ needs.browser-quality.result }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request || "$BASE_REF" != main || "$HEAD_REF" != develop ]]; then
            echo 'No release browser verdict is required for this event.'
            exit 0
          fi
          if [[ "$IS_FORK" != false || "$HEAD_REPOSITORY" != "$REPOSITORY" || "$PR_AUTHOR_TYPE" != User || "$ACTOR" = *'[bot]' || "$TRIGGERING_ACTOR" = *'[bot]' ]]; then
            echo 'Release browser verdict failed: candidate is not a trusted same-repository human PR.' >&2
            exit 1
          fi
          if [[ "$POLICY_RESULT" != success || "$POLICY_RUN_BROWSER" != true ]]; then
            echo 'Release browser verdict failed: release policy did not enable the required browser suite.' >&2
            exit 1
          fi
          if [[ "$BROWSER_RESULT" != success ]]; then
            echo "Release browser verdict failed: browser suite result was $BROWSER_RESULT." >&2
            exit 1
          fi
          echo 'Release browser verdict passed.'
