name: Gate PR security producer

on:
  workflow_call:

jobs:
  producer:
    name: Gate evidence producer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      actions: read
      packages: read
      id-token: write
    steps:
      - name: Produce immutable PR security evidence
        uses: Tuinstra-DEV/devops/.github/actions/gate-pr-security@b2dda8a614e776837baab920c8570848a0062b7b
        env:
          GATE_TRACKER_SCANNER_BINDING: ${{ vars.GATE_TRACKER_SCANNER_BINDING }}
